{{- if eq .Values.epe.mode "managed" }}
{{- if .Values.epe.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "epe.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
  {{- with .Values.epe.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
