{{- if eq .Values.epe.mode "managed" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.kruise.io"]
    resources: ["securityprofiles", "globalsecurityprofiles", "sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "epe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
