{{- if eq .Values.epe.mode "managed" }}
{{- if .Values.epe.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "epe.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "epe.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.epe.service.grpcPort }}
        - port: {{ .Values.epe.service.healthPort }}
        - port: {{ .Values.epe.service.metricsPort }}
{{- end }}
{{- end }}
