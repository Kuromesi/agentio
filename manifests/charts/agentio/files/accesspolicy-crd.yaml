apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accesspolicies.agents.kruise.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
spec:
  group: agents.kruise.io
  names:
    kind: AccessPolicy
    listKind: AccessPolicyList
    plural: accesspolicies
    shortNames:
      - ap
    singular: accesspolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: >-
            AccessPolicy defines reusable access control policies that can be
            referenced by SecurityProfile rules.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                mcpToolPolicy:
                  description: MCPToolPolicy defines MCP tool access control rules.
                  type: object
                  required:
                    - defaultAction
                    - rules
                  properties:
                    defaultAction:
                      description: >-
                        DefaultAction when no rule matches: "deny" (whitelist)
                        or "allow" (blacklist).
                      type: string
                      default: deny
                      enum:
                        - allow
                        - deny
                    unsupportedVersionPolicy:
                      description: >-
                        UnsupportedVersionPolicy controls how tools/call requests
                        with an unsupported or missing MCP-Protocol-Version header
                        are handled. "deny" (default): reject the request.
                        "passthrough": skip ACL evaluation and allow the request.
                      type: string
                      default: deny
                      enum:
                        - deny
                        - passthrough
                    denyResponse:
                      description: >-
                        DenyResponse configures the HTTP response when a tool
                        is denied.
                      type: object
                      properties:
                        statusCode:
                          type: integer
                          format: int32
                          default: 403
                          minimum: 100
                          maximum: 599
                        body:
                          type: string
                    rules:
                      description: Rules are evaluated in order. First match wins.
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - method
                          - action
                        properties:
                          method:
                            description: >-
                              Method is the JSON-RPC method (e.g. "tools/call",
                              "tools/list").
                            type: string
                            minLength: 1
                          toolNames:
                            description: >-
                              ToolNames matches params.name for tools/call.
                              Empty means any tool for this method.
                            type: array
                            items:
                              type: string
                          action:
                            description: 'Action: "allow" or "deny".'
                            type: string
                            enum:
                              - allow
                              - deny
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
