# -- Enhanced traffic management feature.
# Bundles a sandbox-tailored  control plane, sidecar injector, egress gateway,
# and an envoy ext-proc extension. When `enabled` is false (default), none of the
# components below are rendered and behavior is identical to the base chart.
# All resources here run in their own namespace (default: sandbox-traffic-system),
# separate from the main sandbox-manager release namespace.
enhancedTrafficManagement:
  # -- Feature gate. Set true to deploy the enhanced traffic management components.
  enabled: true

  # -- Namespace for all enhanced traffic management resources.
  # Kept distinct from the sandbox-manager release namespace.
  namespace: sandbox-traffic-system

  global:
    hub: registry-cn-hangzhou.ack.aliyuncs.com/dev
    trustDomain: cluster.local
    clusterId: 'Kubernetes'
    # -- CA certificate ConfigMap name. Shared by sidecar injector and ztunnel DaemonSet.
    caCertConfigMap: sandbox-ca-certs
    # -- Mesh-internal traffic policy for sandbox tunnel proxies.
    # PEER_AWARE: full peer identity matching for mTLS and policy enforcement.
    # PASSTHROUGH: skip upstream discovery for in-cluster destinations.
    meshInternalTrafficPolicy: PASSTHROUGH
    # -- When true, ztunnel (both sidecar and node-level) gets NET_ADMIN + root
    # to manage iptables/nftables firewall rules.
    enableFirewallRules: true
  
  ztunnel:
    image:
      hub: ""
      name: sandbox-tunnel
      tag: v0.1-5-gb51a6b9-aliyun

  sidecarInjector:
    enabled: true

  gatewayController:
    name: gateway-controller
     # -- Single identifier shared by MESH_CONFIG_MAP_NAME, INJECTOR_CONFIG_MAP_NAME,
    # LEADER_ELECTION_PREFIX, INJECTION_WEBHOOK_CONFIG_NAME and the matching ConfigMap /
    # MutatingWebhookConfiguration names. Change in one place; all references follow.
    resourcePrefix: pilot
    replicas: 1
    env: {}
    krtEventDistributeDebounce: "200ms"
    krtEventDistributeDebounceMax: "10s"
    enableTlsTermination: true
    onDemandCertSignMode: "SELF_SIGN"
    # -- Optional. When set, sets pilot RESTRICTED_SECRETS_SCOPE; when empty,
    # the env var is omitted and pilot uses its built-in default.
    restrictedSecretsScope: true
    autoscaling:
      # -- Set to false to skip rendering the HPA. When true, `replicas` above is ignored.
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    image:
      hub: ""
      name: pilot
      tag: v0.1-43-gc7543ab9f-aliyun
    # CPU request must equal limit so HPA-based utilization is meaningful.
    resources:
      requests:
        cpu: "4"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
    # -- Node selector for control plane pods.
    nodeSelector: { }
    # -- Tolerations for control plane pods.
    tolerations: [ ]
    # -- Affinity rules for control plane pods.
    affinity: { }

  egressGateway:
    image:
      hub: ""
      name: proxyv2
      tag: v0.1-4-g733eb5a2-aliyun
    env: {}
    # global defaults for all gateways, can be overridden per gateway
    replicas: 1
    autoscaling:
      # -- Set to false to skip rendering the HPA. Per-gateway `gateways[].autoscaling.enabled` overrides this.
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    # CPU request must equal limit so HPA-based utilization is meaningful.
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
    # stats flush/eviction intervals, can be overridden per gateway
    statsFlushInterval: "10s"
    statsEvictionInterval: "300s"
    # -- Default TLS termination host filters; flows into sandbox-config.egressGateways[].tlsTermination.
    # Per-gateway override via gateways[].tlsTermination. Block is omitted from sandbox-config when both lists empty.
    tlsTermination:
      includeHosts: [ ]
      excludeHosts: [ ]
    # -- Pod terminationGracePeriodSeconds. Can be overridden per gateway via gateways[].terminationGracePeriodSeconds.
    terminationGracePeriodSeconds: 30
    # -- PDB minAvailable for each egress gateway. Can be overridden per gateway via gateways[].pdbMinAvailable.
    pdbMinAvailable: 1
    # -- Default scheduling for all egress gateways. Each entry below can be overridden per gateway
    # via gateways[].nodeSelector / gateways[].tolerations / gateways[].affinity.
    nodeSelector: { }
    tolerations: [ ]
    affinity: { }
    gateways:
      - name: egress-gateway

  trafficExtension:
    enabled: true
    name: traffic-extension
    port: 9002
    env: {}
    # -- Replica count when autoscaling.enabled is false. Ignored when HPA is enabled.
    replicas: 1
    # -- Identity provider endpoint used by the extension to mint sandbox tokens.
    identityProviderUrl: "https://credential-provider.ack-agent-identity.svc.cluster.local:8443/"
    autoscaling:
      # -- Set to false to skip rendering the HPA.
      enabled: true
      minReplicas: 2
      maxReplicas: 50
      targetCPUUtilizationPercentage: 80
    # CPU request must equal limit so HPA-based utilization is meaningful.
    resources:
      requests:
        cpu: 2
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi
    image:
      hub: "registry-cn-hangzhou.ack.aliyuncs.com/acs"
      name: ack-sandbox-traffic-extension
      tag: v0.1.1
    # -- PDB minAvailable for the traffic extension Deployment.
    pdbMinAvailable: 1
    # -- Node selector for sandbox traffic extension pods.
    nodeSelector: { }
    # -- Tolerations for sandbox traffic extension pods.
    tolerations: [ ]
    # -- Affinity rules for sandbox traffic extension pods.
    affinity: { }

  egressPolicies:
    - gateway:
        service: egress-gateway.sandbox-traffic-system.svc.cluster.local
      policy: GATEWAY

  # -- Ambient mode. When enabled, deploys a node-level CNI DaemonSet and ztunnel
  # DaemonSet for ambient mesh. Independent of sidecarInjector — both can be
  # enabled simultaneously if needed.
  ambient:
    # -- Set true to deploy the CNI + ztunnel DaemonSets.
    enabled: true

    cni:
      image:
        hub: ""
        name: asm-istio-cni
        tag: v1.29.2.43-gccce198f63-aliyun
      # -- Host paths for CNI binary and config installation
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d
      cniConfFileName: ""
      cniNetnsDir: /var/run/netns
      # -- Deploy as chained CNI plugin (true) or standalone (false)
      chained: true
      # -- Namespaces excluded from CNI ambient redirection
      excludeNamespaces:
        - kube-system
      # -- Enablement selector for ambient mode. Pods/namespaces matching
      # these selectors will be enrolled into the ambient mesh.
      enablementSelector:
        # Pod 级：pod 自身有标签即启用
        - podSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
        # Namespace 级：namespace 有标签，且 pod 未显式 opt-out
        - podSelector:
            matchExpressions:
              - key: istio.io/dataplane-mode
                operator: NotIn
                values: [none]
          namespaceSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
      # -- DNS capture for ambient pods
      dnsCapture: true
      # -- IPv6 support
      ipv6: true
      # -- Reconcile iptables rules at startup
      reconcileIptablesOnStartup: true
      # -- Pod repair settings
      repair:
        enabled: true
        repairPods: true
        labelPods: false
        deletePods: false
        initContainerName: "istio-validation"
        brokenPodLabelKey: "cni.istio.io/uninitialized"
        brokenPodLabelValue: "true"
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
      terminationGracePeriodSeconds: 30

    ztunnel:
      logLevel: info
      # -- Output ztunnel logs in JSON format.
      logAsJson: true
      # -- Extra environment variables as key-value pairs injected into the ztunnel container.
      env: {}
      resources:
        requests:
          cpu: 1
          memory: 1024Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      terminationGracePeriodSeconds: 30
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

  # -- Raw overrides merged on top of the built-in sandbox-config ConfigMap body.
  # Use this to set fields the chart does not model explicitly (e.g. clusterSettings)
  # or to override defaults. Maps deep-merge; lists are replaced wholesale.
  sandboxConfig: { }
