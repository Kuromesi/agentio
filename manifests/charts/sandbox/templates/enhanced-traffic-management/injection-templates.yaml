{{- if .Values.enhancedTrafficManagement.enabled }}
{{- if .Values.enhancedTrafficManagement.sidecarInjector.enabled }}
apiVersion: v1
data:
  config: |-
{{ .Files.Get "files/enhanced-traffic-management/injection-config.yaml" | indent 4 }}
  values: |-
    {
      "gateways": {
        "seccompProfile": {},
        "securityContext": {}
      },
      "global": {
        "proxy_ztunnel": {
          "image": "{{ include "sandbox.ztunnelImage" . }}",
          "enableFirewallRules": {{ .Values.enhancedTrafficManagement.global.enableFirewallRules | default false }}
        },
        "caAddress": "{{ include "sandbox.controller.name" . }}.{{ include "sandbox.namespace" . }}.svc.cluster.local:15012",
        "xdsAddress": "{{ include "sandbox.controller.name" . }}.{{ include "sandbox.namespace" . }}.svc.cluster.local:15012",
        "trustBundleName": "{{ include "sandbox.caCertConfigMap" . }}",
        "caName": "",
        "certSigners": [],
        "configCluster": false,
        "configValidation": true,
        "defaultPodDisruptionBudget": {
          "enabled": true
        },
        "defaultResources": {
          "requests": {
            "cpu": "10m"
          }
        },
        "externalIstiod": false,
        "hub": "{{ .Values.enhancedTrafficManagement.global.hub }}",
        "imagePullPolicy": "",
        "imagePullSecrets": [],
        "istioNamespace": "{{ include "sandbox.namespace" . }}",
        "istiod": {
          "enableAnalysis": false
        },
        "logAsJson": false,
        "logging": {
          "level": "default:info"
        },
        "meshID": "",
        "meshNetworks": {},
        "mountMtlsCerts": false,
        "multiCluster": {
          "clusterName": "{{ .Values.enhancedTrafficManagement.global.clusterId }}"
        },
        "nativeNftables": false,
        "network": "",
        "networkPolicy": {
          "enabled": false
        },
        "omitSidecarInjectorConfigMap": false,
        "operatorManageWebhooks": false,
        "pilotCertProvider": "istiod",
        "priorityClassName": "",
        "proxy": {
          "image": "{{ .Values.enhancedTrafficManagement.egressGateway.image.hub | default .Values.enhancedTrafficManagement.global.hub }}/{{ .Values.enhancedTrafficManagement.egressGateway.image.name }}:{{ .Values.enhancedTrafficManagement.egressGateway.image.tag }}",
          "autoInject": "enabled",
          "clusterDomain": "{{ .Values.enhancedTrafficManagement.global.trustDomain }}",
          "componentLogLevel": "misc:error",
          "excludeIPRanges": "",
          "excludeInboundPorts": "",
          "excludeOutboundPorts": "",
          "includeIPRanges": "*",
          "includeInboundPorts": "*",
          "includeOutboundPorts": "",
          "logLevel": "warning",
          "outlierLogPath": "",
          "privileged": false,
          "readinessFailureThreshold": 4,
          "readinessInitialDelaySeconds": 0,
          "readinessPeriodSeconds": 15,
          "resources": {
            "limits": {
              "cpu": "2000m",
              "memory": "1024Mi"
            },
            "requests": {
              "cpu": "100m",
              "memory": "128Mi"
            }
          },
          "seccompProfile": {},
          "startupProbe": {
            "enabled": true,
            "failureThreshold": 600
          },
          "statusPort": 15020,
          "tracer": "none"
        },
        "proxy_init": {
          "forceApplyIptables": false,
          "image": "{{ .Values.enhancedTrafficManagement.egressGateway.image.hub | default .Values.enhancedTrafficManagement.global.hub }}/{{ .Values.enhancedTrafficManagement.egressGateway.image.name }}:{{ .Values.enhancedTrafficManagement.egressGateway.image.tag }}"
        },
        "remotePilotAddress": "",
        "resourceScope": "all",
        "sds": {
          "token": {
            "aud": "istio-ca"
          }
        },
        "sts": {
          "servicePort": 0
        },
        "tag": "{{ .Values.enhancedTrafficManagement.egressGateway.image.tag }}",
        "variant": "distroless",
        "waypoint": {
          "affinity": {},
          "nodeSelector": {},
          "resources": {
            "limits": {
              "cpu": "2",
              "memory": "1Gi"
            },
            "requests": {
              "cpu": "100m",
              "memory": "128Mi"
            }
          },
          "tolerations": [],
          "topologySpreadConstraints": []
        }
      },
      "pilot": {
        "cni": {
          "ambient": {
            "enabled": true
          },
          "provider": "default"
        },
        "env": {
          "PILOT_ENABLE_AMBIENT": "true"
        }
      },
      "revision": "",
      "sidecarInjectorWebhook": {
        "alwaysInjectSelector": [],
        "defaultTemplates": [],
        "enableNamespacesByDefault": false,
        "injectedAnnotations": {},
        "neverInjectSelector": [],
        "reinvocationPolicy": "Never",
        "rewriteAppHTTPProbe": true,
        "templates": {}
      }
    }
kind: ConfigMap
metadata:
  name: {{ .Values.enhancedTrafficManagement.gatewayController.resourcePrefix }}-sidecar-injector
  namespace: {{ include "sandbox.namespace" . }}
{{- end }}
{{- end }}
