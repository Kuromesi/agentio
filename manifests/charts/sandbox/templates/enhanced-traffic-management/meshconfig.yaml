{{- define "enhancedTrafficManagement.meshConfig" }}
ingressControllerMode: "OFF"
defaultConfig:
  discoveryAddress: {{ include "sandbox.controller.name" . }}.{{ include "sandbox.namespace" . }}.svc:15012
defaultProviders:
  accessLogging:
  - envoy
  metrics:
  - prometheus
extensionProviders:
- name: envoy
  envoyFileAccessLog:
    path: /dev/stdout
    omitEmptyValues: true
    logFormat:
      labels:
        authority_for: '%REQ(:AUTHORITY)%'
        bytes_received: '%BYTES_RECEIVED%'
        bytes_sent: '%BYTES_SENT%'
        downstream_address: '%DOWNSTREAM_REMOTE_ADDRESS%'
        duration: '%DURATION%'
        method: '%REQ(:METHOD)%'
        path: '%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%'
        protocol: '%PROTOCOL%'
        request_id: '%REQ(X-REQUEST-ID)%'
        requested_server_name: '%REQUESTED_SERVER_NAME%'
        response_code: '%RESPONSE_CODE%'
        response_flags: '%RESPONSE_FLAGS%'
        start_time: '%START_TIME%'
        trace_id: '%TRACE_ID%'
        upstream_address: '%DOWNSTREAM_LOCAL_ADDRESS%'
        transport_failure_reason: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
        user_agent: '%REQ(USER-AGENT)%'
        sandbox_name: '%CEL(filter_state[''downstream_peer''].name)%'
        sandbox_namespace: '%CEL(filter_state[''downstream_peer''].namespace)%'
enablePrometheusMerge: true
rootNamespace: {{ include "sandbox.namespace" . }}
trustDomain: {{ .Values.enhancedTrafficManagement.global.trustDomain }}
{{- end }}

{{- if .Values.enhancedTrafficManagement.enabled }}
{{/* Merge built-in defaults above with user overrides from .Values.enhancedTrafficManagement.meshConfig. */}}
{{/* The intent is that meshConfig.foo becomes the raw API rather than re-modeling every field in values.yaml. */}}
{{- $defaults := include "enhancedTrafficManagement.meshConfig" . | fromYaml }}
{{- $mesh := mergeOverwrite $defaults (.Values.enhancedTrafficManagement.meshConfig | default dict) }}
apiVersion: v1
data:
  mesh: |-
{{ $mesh | toYaml | indent 4 }}
  meshNetworks: 'networks: {}'
kind: ConfigMap
metadata:
  labels:
    app: {{ include "sandbox.controller.name" . }}
  name: {{ .Values.enhancedTrafficManagement.gatewayController.resourcePrefix }}
  namespace: {{ include "sandbox.namespace" . }}
{{- end }}
