{{- if and .Values.enhancedTrafficManagement.enabled .Values.enhancedTrafficManagement.ambient.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "sandbox.cni.labels" . | nindent 4 }}
  name: {{ include "sandbox.cni.configName" . }}
  namespace: {{ include "sandbox.namespace" . }}
data:
  CURRENT_AGENT_VERSION: {{ .Values.enhancedTrafficManagement.ambient.cni.image.tag | quote }}
  AMBIENT_ENABLED: "true"
  AMBIENT_DNS_CAPTURE: {{ .Values.enhancedTrafficManagement.ambient.cni.dnsCapture | quote }}
  AMBIENT_IPV6: {{ .Values.enhancedTrafficManagement.ambient.cni.ipv6 | quote }}
  AMBIENT_RECONCILE_POD_RULES_ON_STARTUP: {{ .Values.enhancedTrafficManagement.ambient.cni.reconcileIptablesOnStartup | quote }}
  {{- if .Values.enhancedTrafficManagement.ambient.cni.cniConfFileName }}
  CNI_CONF_NAME: {{ .Values.enhancedTrafficManagement.ambient.cni.cniConfFileName | quote }}
  {{- end }}
  CHAINED_CNI_PLUGIN: {{ .Values.enhancedTrafficManagement.ambient.cni.chained | quote }}
  EXCLUDE_NAMESPACES: "{{ range $idx, $ns := .Values.enhancedTrafficManagement.ambient.cni.excludeNamespaces }}{{ if $idx }},{{ end }}{{ $ns }}{{ end }}"
  REPAIR_ENABLED: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.enabled | quote }}
  REPAIR_LABEL_PODS: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.labelPods | quote }}
  REPAIR_DELETE_PODS: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.deletePods | quote }}
  REPAIR_REPAIR_PODS: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.repairPods | quote }}
  REPAIR_INIT_CONTAINER_NAME: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.initContainerName | quote }}
  REPAIR_BROKEN_POD_LABEL_KEY: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.brokenPodLabelKey | quote }}
  REPAIR_BROKEN_POD_LABEL_VALUE: {{ .Values.enhancedTrafficManagement.ambient.cni.repair.brokenPodLabelValue | quote }}
  AMBIENT_ENABLEMENT_SELECTOR: |
    {{- .Values.enhancedTrafficManagement.ambient.cni.enablementSelector | toYaml | nindent 4 }}
{{- end }}
