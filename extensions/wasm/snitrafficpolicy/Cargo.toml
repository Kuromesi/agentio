[package]
name = "agentio-sni-policy-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
proxy-wasm = { git = "https://github.com/proxy-wasm/proxy-wasm-rust-sdk", rev = "4930296ed8e3601f062196ede46603ae755d565c" }

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
