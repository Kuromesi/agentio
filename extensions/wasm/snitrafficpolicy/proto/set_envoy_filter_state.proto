syntax = "proto3";

package envoy.source.extensions.common.wasm;

enum LifeSpan {
  FilterChain = 0;
  DownstreamRequest = 1;
  DownstreamConnection = 2;
}

message SetEnvoyFilterStateArguments {
  string path = 1;
  string value = 2;
  LifeSpan span = 3;
}
