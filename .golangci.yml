version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - revive
    - dupl
    - funlen
    - gocyclo
    - errorlint
  settings:
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: unexported-return
    dupl:
      threshold: 150
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 20
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - revive

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openkruise/agentio
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
