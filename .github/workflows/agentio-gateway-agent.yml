name: agentio-gateway-agent

# Build an opt-in gateway artifact without changing product images or deployment.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agentio-gateway-agent.yml"
      - "cmd/gateway-agent/**"
      - "pkg/gatewayagent/**"
      - "pkg/log/**"
      - "docker/Dockerfile.gateway"
      - "bin/test_gateway_runtime.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "NOTICE"
  push:
    branches: [master]
    paths:
      - ".github/workflows/agentio-gateway-agent.yml"
      - "cmd/gateway-agent/**"
      - "pkg/gatewayagent/**"
      - "pkg/log/**"
      - "docker/Dockerfile.gateway"
      - "bin/test_gateway_runtime.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

concurrency:
  group: agentio-gateway-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gateway agent has no Istio Go dependencies
        run: |
          go list -deps -test ./cmd/gateway-agent ./pkg/gatewayagent/... > "$RUNNER_TEMP/gateway-dependencies.txt"
          if grep -q '^istio.io/' "$RUNNER_TEMP/gateway-dependencies.txt"; then
            echo "gateway-agent must maintain its implementation locally; Istio Go imports are forbidden" >&2
            exit 1
          fi
      - name: Build and test gateway agent
        run: |
          make build.gateway-agent test.gateway-agent
          go vet ./cmd/gateway-agent ./pkg/gatewayagent/...
      - name: Build isolated community Envoy image
        run: |
          docker build -f docker/Dockerfile.gateway \
            --build-arg "AGENT_VERSION=$GITHUB_SHA" \
            --build-arg "AGENT_REVISION=$GITHUB_SHA" \
            -t agentio-gateway:validation .
      - name: Validate image entrypoint and Envoy runtime
        run: |
          docker run --rm agentio-gateway:validation version
          ./bin/test_gateway_runtime.sh agentio-gateway:validation
