name: agentio-image

# Build and push Agentio, CNI, and ztunnel container images to Docker Hub.
# Follows Istio's release-commit.sh tag strategy:
# - pushes to protected release-* branches publish development images;
# - agentio-release calls this workflow for trusted semantic-version tags.
#
# Auth (set in repo Settings → Actions):
#   vars.DOCKERHUB_USERNAME — Docker Hub account name (repository Variable)
#   secrets.HUB_KRUISE      — Docker Hub token in the `development` and protected
#                             `release` Environments

on:
  push:
    branches:
      - "release-*"
  workflow_call:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  BUILD_WITH_CONTAINER: "0"
  ISTIO_DOCKER_BUILDER: docker
  HUB: docker.io/openkruise

concurrency:
  group: agentio-image-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release-') }}

jobs:
  build-ztunnel:
    name: Build ztunnel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            file_pattern: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            file_pattern: aarch64
    steps:
      - name: Checkout Agentio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve pinned ztunnel revision
        id: ztunnel
        run: |
          repository=$(jq -er '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .repoName' agentio.deps)
          sha=$(jq -er '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .lastStableSHA' agentio.deps)
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid ztunnel repository: $repository" >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ZTUNNEL_REPO_SHA: $sha" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout ztunnel
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.ztunnel.outputs.repository }}
          ref: ${{ steps.ztunnel.outputs.sha }}
          path: ztunnel-src
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Build ztunnel
        working-directory: ztunnel-src
        run: cargo build --locked --release

      - name: Verify ztunnel architecture
        env:
          EXPECTED_PATTERN: ${{ matrix.file_pattern }}
        run: |
          binary=ztunnel-src/out/rust/release/ztunnel
          file "$binary"
          file "$binary" | grep -F "$EXPECTED_PATTERN"
          install -D -m 0755 "$binary" ztunnel-artifact/ztunnel

      - name: Upload ztunnel binary
        uses: actions/upload-artifact@v6
        with:
          name: ztunnel-${{ matrix.arch }}
          path: ztunnel-artifact/ztunnel
          if-no-files-found: error
          retention-days: 1

  build-images:
    needs: build-ztunnel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ startsWith(github.ref, 'refs/heads/release-') && 'development' || 'release' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download amd64 ztunnel
        uses: actions/download-artifact@v7
        with:
          name: ztunnel-amd64
          path: out/linux_amd64

      - name: Download arm64 ztunnel
        uses: actions/download-artifact@v7
        with:
          name: ztunnel-arm64
          path: out/linux_arm64

      - name: Verify ztunnel inputs
        run: |
          chmod 0755 out/linux_amd64/ztunnel out/linux_arm64/ztunnel
          file out/linux_amd64/ztunnel | grep -F x86-64
          file out/linux_arm64/ztunnel | grep -F aarch64

      - name: Resolve Agentio ztunnel version
        run: |
          sha=$(jq -er '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .lastStableSHA' agentio.deps)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ZTUNNEL_REPO_SHA: $sha" >&2
            exit 1
          fi
          echo "ZTUNNEL_REPO_SHA=$sha" >> "$GITHUB_ENV"

      - name: Validate requested tag and ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" && ! "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid OCI image tag: $INPUT_TAG" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" =~ ^refs/heads/release-([0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?)$ ]]; then
            if [[ -n "$INPUT_TAG" ]]; then
              echo "Development image builds must derive tags from the release branch commit" >&2
              exit 1
            fi
            exit 0
          fi

          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Image publication requires a versioned release branch or semantic version tag" >&2
            exit 1
          fi
          if [[ "$INPUT_TAG" != "${BASH_REMATCH[1]}" ]]; then
            echo "Requested image tag does not match Git tag" >&2
            exit 1
          fi

          is_trusted_branch() {
            local branch="$1"
            [[ "$branch" == "master" || "$branch" =~ ^release-[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]
          }

          trusted_commit=false
          while IFS= read -r remote_branch; do
            branch="${remote_branch#origin/}"
            if is_trusted_branch "$branch"; then
              trusted_commit=true
              break
            fi
          done < <(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')
          if [[ "$trusted_commit" != "true" ]]; then
            echo "Release tag commit is not reachable from master or a versioned release branch" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.HUB_KRUISE }}

      - name: Compute image tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid OCI image tag: $INPUT_TAG" >&2
              exit 1
            fi
            echo "PRIMARY_TAG=${INPUT_TAG}" >> "$GITHUB_ENV"
            if [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "EXTRA_TAGS=latest" >> "$GITHUB_ENV"
            else
              echo "EXTRA_TAGS=" >> "$GITHUB_ENV"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "PRIMARY_TAG=${VERSION}" >> "$GITHUB_ENV"
            echo "EXTRA_TAGS=latest" >> "$GITHUB_ENV"
          else
            SHA="${GITHUB_SHA}"
            if [[ ! "${GITHUB_REF}" =~ ^refs/heads/release-([0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?)$ ]]; then
              echo "Development image publication requires a versioned release branch" >&2
              exit 1
            fi
            VER="${BASH_REMATCH[1]}"
            echo "PRIMARY_TAG=${SHA}" >> "$GITHUB_ENV"
            echo "EXTRA_TAGS=${VER}-alpha.${SHA},${VER}-dev" >> "$GITHUB_ENV"
          fi

      - name: Build and push Agentio images
        run: |
          DOCKER_ARCHITECTURES=linux/amd64,linux/arm64 \
          DOCKER_BUILD_VARIANTS=default \
          DOCKER_TARGETS="docker.pilot docker.proxy-init docker.install-cni" \
          make docker.push HUB="${HUB}" TAG="${PRIMARY_TAG}"

      - name: Package and push ztunnel image
        run: |
          SKIP_MAKE=true \
          DOCKER_ARCHITECTURES=linux/amd64,linux/arm64 \
          DOCKER_BUILD_VARIANTS=default \
          DOCKER_TARGETS="docker.ztunnel" \
          TAG="${PRIMARY_TAG}" \
          ./tools/docker --push --ztunnel-version="${ZTUNNEL_REPO_SHA}"

      - name: Push extra tags (latest, dev, alpha)
        if: env.EXTRA_TAGS != ''
        run: |
          # Install a version pinned through Go module verification.
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

          IFS=',' read -ra TAGS <<< "${EXTRA_TAGS}"
          for image in pilot proxy-init install-cni ztunnel; do
            for tag in "${TAGS[@]}"; do
              echo "Tagging ${HUB}/${image}:${PRIMARY_TAG} -> ${tag}"
              crane tag "${HUB}/${image}:${PRIMARY_TAG}" "${tag}"
            done
          done
