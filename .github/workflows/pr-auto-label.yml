name: PR Auto Label

on:
  # This workflow never checks out or executes PR code, so pull_request_target
  # safely allows labels to be updated for fork PRs as well.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Calculate PR size
        id: size
        run: |
          ADDITIONS="$PR_ADDITIONS"
          DELETIONS="$PR_DELETIONS"
          TOTAL=$((ADDITIONS + DELETIONS))

          {
            echo "additions=$ADDITIONS"
            echo "deletions=$DELETIONS"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

          # Determine size label based on total line count
          if [[ $TOTAL -lt 10 ]]; then
            echo "label=size/XS" >> "$GITHUB_OUTPUT"
          elif [[ $TOTAL -lt 30 ]]; then
            echo "label=size/S" >> "$GITHUB_OUTPUT"
          elif [[ $TOTAL -lt 100 ]]; then
            echo "label=size/M" >> "$GITHUB_OUTPUT"
          elif [[ $TOTAL -lt 500 ]]; then
            echo "label=size/L" >> "$GITHUB_OUTPUT"
          elif [[ $TOTAL -lt 1000 ]]; then
            echo "label=size/XL" >> "$GITHUB_OUTPUT"
          else
            echo "label=size/XXL" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}

      - name: Remove old size labels
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          LABELS=$(gh pr view $PR_NUM --json labels -q '.labels[].name')

          # Remove all existing size/* labels
          for LABEL in $LABELS; do
            if [[ "$LABEL" == size/* ]]; then
              gh pr edit $PR_NUM --remove-label "$LABEL"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add new size label
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          LABEL="${{ steps.size.outputs.label }}"
          TOTAL="${{ steps.size.outputs.total }}"

          gh pr edit $PR_NUM --add-label "$LABEL"
          echo "✅ Labeled PR with $LABEL (+${{ steps.size.outputs.additions }} -${{ steps.size.outputs.deletions }} = $TOTAL lines)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
