name: agentio-e2e

# KinD-based end-to-end tests for the Agentio data plane.
#
# Agentio control-plane, CNI, and test components are built from this checkout.
# The patched ztunnel source and the proxy image are pinned by agentio.deps.
# All images are pushed only to the KinD-local registry.
#
# The proxy is pulled from the public Docker Hub mirror that agentio-release.yml
# publishes, so this workflow needs no registry credentials and runs unchanged on
# pull requests from forks. Bumping PROXY_IMAGE_DIGEST ahead of a release makes
# the mirror lag the pin and turns this workflow red until the release lands.
#
# Failures are intentional signal: registry access and cluster setup are part of
# the end-to-end contract and must not be reported as a successful check.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
      - "release-*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

# Drop superseded pull request runs, but let every branch run finish so each
# merged commit reports an end-to-end result.
concurrency:
  group: agentio-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ztunnel:
    name: Build pinned ztunnel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.ztunnel.outputs.sha }}
    steps:
      - name: Checkout Agentio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve pinned ztunnel revision
        id: ztunnel
        run: |
          repository=$(jq -er '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .repoName' agentio.deps)
          sha=$(jq -er '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .lastStableSHA' agentio.deps)
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid ztunnel repository: $repository" >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ZTUNNEL_REPO_SHA: $sha" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # ZTUNNEL_REPO_SHA only moves through the nightly sync-ztunnel-deps pull
      # request, so pull requests restore the binary that the last push run on
      # master or on their base branch built instead of rebuilding it. Pull
      # request runs cannot seed this cache for other pull requests; the push
      # runs on master and release-* do that.
      - name: Restore pinned ztunnel binary
        id: ztunnel-cache
        uses: actions/cache@v6
        with:
          path: ztunnel-artifact/ztunnel
          key: agentio-e2e-ztunnel-amd64-${{ steps.ztunnel.outputs.sha }}

      - name: Checkout ztunnel
        if: steps.ztunnel-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.ztunnel.outputs.repository }}
          ref: ${{ steps.ztunnel.outputs.sha }}
          path: ztunnel-src
          persist-credentials: false

      - name: Build ztunnel
        if: steps.ztunnel-cache.outputs.cache-hit != 'true'
        working-directory: ztunnel-src
        run: ./common/scripts/run.sh cargo build --locked --release

      - name: Stage ztunnel binary
        if: steps.ztunnel-cache.outputs.cache-hit != 'true'
        run: |
          install -D -m 0755 ztunnel-src/out/rust/release/ztunnel ztunnel-artifact/ztunnel

      # A restored cache is untrusted input, so this also guards the cache hit.
      - name: Verify ztunnel architecture
        run: file ztunnel-artifact/ztunnel | grep -F x86-64

      - name: Upload ztunnel binary
        uses: actions/upload-artifact@v6
        with:
          name: agentio-e2e-ztunnel-amd64
          path: ztunnel-artifact/ztunnel
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build-ztunnel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Run make/build natively (we install go/helm/kind below) rather than in
      # the Istio build container, and build images with the docker builder.
      BUILD_WITH_CONTAINER: "0"
      ISTIO_DOCKER_BUILDER: docker
      JOB_TYPE: presubmit
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Install KinD and test reporting tools
        run: |
          go install sigs.k8s.io/kind@v0.24.0
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Download pinned ztunnel
        uses: actions/download-artifact@v7
        with:
          name: agentio-e2e-ztunnel-amd64
          path: ${{ runner.temp }}/agentio-e2e-ztunnel
      - name: Run agentio e2e scenarios (KinD)
        env:
          ARTIFACTS: ${{ runner.temp }}/agentio-e2e-artifacts
          # agentio-release.yml mirrors the pinned proxy here with crane copy,
          # which preserves the manifest digest, so the PROXY_IMAGE_DIGEST in
          # agentio.deps resolves against this public repository without
          # credentials.
          AGENTIO_E2E_PROXY_IMAGE: docker.io/openkruise/proxyv2
          AGENTIO_E2E_ZTUNNEL_BINARY: ${{ runner.temp }}/agentio-e2e-ztunnel/ztunnel
          AGENTIO_E2E_ZTUNNEL_VERSION: ${{ needs.build-ztunnel.outputs.sha }}
        run: prow/integ-suite-agentio-kind.sh
      - name: Upload agentio e2e artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentio-e2e-artifacts
          path: ${{ runner.temp }}/agentio-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
