name: agentio-e2e

# KinD-based end-to-end tests for the agentio sandbox data plane.
#
# Component images:
#   - pilot(agentiod), install-cni, echo app, and ext-proc are BUILT from this
#     repo and pushed only to the KinD-local registry by the Agentio-specific
#     script.
#   - proxy and ztunnel are pulled anonymously from the external ACR references
#     configured in the job environment. No registry credentials are used.
#
# Failures are intentional signal: registry access and cluster setup are part of
# the end-to-end contract and must not be reported as a successful check.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manifests/charts/agentio/**"
      - "pilot/pkg/serviceregistry/kube/controller/agentio/**"
      - "pilot/pkg/networking/core/**"
      - "tests/integration/agentio/**"
      - "pkg/test/framework/components/sandbox/**"
      - "pkg/test/extproc/**"
      - "prow/integ-suite-agentio-kind.sh"
      - "Makefile.core.mk"
      - "tools/docker.yaml"
      - ".github/workflows/agentio-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Run make/build natively (we install go/helm/kind below) rather than in
      # the Istio build container, and build images with the docker builder.
      BUILD_WITH_CONTAINER: "0"
      ISTIO_DOCKER_BUILDER: docker
      JOB_TYPE: presubmit
      AGENTIO_PROXY_IMAGE_HUB: registry-cn-hangzhou.ack.aliyuncs.com/dev
      AGENTIO_PROXY_IMAGE_NAME: proxyv2
      AGENTIO_PROXY_IMAGE_TAG: v0.1-4-g733eb5a2-aliyun
      AGENTIO_ZTUNNEL_IMAGE_HUB: registry-cn-hangzhou.ack.aliyuncs.com/dev
      AGENTIO_ZTUNNEL_IMAGE_NAME: sandbox-tunnel
      AGENTIO_ZTUNNEL_IMAGE_TAG: v0.1-11-ge4be822-aliyun
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install KinD and test reporting tools
        run: |
          go install sigs.k8s.io/kind@v0.24.0
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run agentio e2e (KinD)
        run: prow/integ-suite-agentio-kind.sh
