name: agentio-ut

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - name: Validate dependency pins
        run: |
          jq -e '
            def image_pin(pin_name):
              ([.[] | select(.name == pin_name)] | length) == 1 and
              (.[] | select(.name == pin_name) |
                (.repository | test("^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$")) and
                (.digest | test("^sha256:[0-9a-f]{64}$")));
            image_pin("ZTUNNEL_IMAGE") and
            image_pin("CNI_IMAGE") and
            image_pin("PROXY_INIT_IMAGE") and
            image_pin("GATEWAY_IMAGE")
          ' agentio.deps >/dev/null
      - name: Build agentiod
        run: make build
      - name: Run unit tests
        run: make test
      - name: Run linters
        run: make lint
      - name: Run tests with the race detector
        run: make racetest
