name: agentio-ut

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
      - "release-*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: gcr.io/istio-testing/build-tools:release-1.29-ab0c7c31cf56f17a33788ee67aa501a87c054ba2
      options: --privileged
    env:
      BUILD_WITH_CONTAINER: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The build-tools image may ship an older Go with GOTOOLCHAIN=local.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Istio unit test suite
        env:
          JUNIT_OUT: ${{ runner.temp }}/junit.xml
        run: |
          # Use setup-go's toolchain, not the image's /usr/local/go compiler.
          unset GOROOT
          go version
          go tool compile -V
          make -e "T=-v -count=1" build racetest binaries-test
