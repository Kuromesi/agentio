name: env-docs

on:
  pull_request:
    branches:
      - master
    paths:
      - "cmd/**"
      - "pkg/**"
      - "extensions/epe/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "tools/envdocs/**"
      - "docs/reference/agentiod-environment-variables.md"
      - "docs/reference/epe-configuration.md"
      - ".github/workflows/env-docs.yml"
  push:
    branches:
      - master
    paths:
      - "cmd/**"
      - "pkg/**"
      - "extensions/epe/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "tools/envdocs/**"
      - "docs/reference/agentiod-environment-variables.md"
      - "docs/reference/epe-configuration.md"
      - ".github/workflows/env-docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify environment reference tables
        run: make check.envdocs
