name: copyright

on:
  pull_request:
    branches:
      - master
      - "release-*"
    paths:
      - "**/*.go"
      - "bin/lint_copyright_kruise.sh"
      - ".github/workflows/copyright.yml"
  push:
    branches:
      - master
      - "release-*"
    paths:
      - "**/*.go"
      - "bin/lint_copyright_kruise.sh"
      - ".github/workflows/copyright.yml"

permissions:
  contents: read

jobs:
  copyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            echo "ref=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if ! git rev-parse -q --verify "${before}^{commit}" >/dev/null 2>&1; then
              before="HEAD~1"
            fi
            echo "ref=${before}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check copyright headers
        run: ./bin/lint_copyright_kruise.sh "${{ steps.base.outputs.ref }}"
