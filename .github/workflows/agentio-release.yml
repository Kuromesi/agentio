name: agentio-release

# Manually release the selected master or release branch commit. The workflow
# creates the Agentio tag, builds and publishes all artifacts, tags the pinned
# ztunnel commit, creates the GitHub Release, and then proposes the released
# chart to openkruise/charts.
#
# proxy is the only closed-source component mirrored from the internal ACR.
# Traffic extensions such as agentio-epe are built from this repository and
# follow the Agentio release version like every other in-tree image.
#
# Auth (set in repo Settings → Actions):
#   vars.DOCKERHUB_USERNAME — Docker Hub account name (repository Variable)
# Store the Docker Hub credential and, when required, the ACR credential pair in
# the `release` Environment. Protect that Environment with reviewers and branch
# restrictions in repository settings.
#   secrets.HUB_KRUISE      — Docker Hub access token
#   secrets.ACR_USERNAME    — optional read-only account for the proxy registry
#   secrets.ACR_TOKEN       — optional read-only token for the proxy registry
#   vars.PROXY_SOURCE_IMAGE — proxy repository without a tag or digest
#   vars.AGENTIO_SYNC_APP_CLIENT_ID and secrets.AGENTIO_SYNC_APP_PRIVATE_KEY
#                           — GitHub App with contents:write on openkruise/ztunnel
#                             and contents:write + pull_requests:write on
#                             openkruise/charts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (for example, 0.1.0 or 0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  CHART: manifests/charts/agentio
  CHART_REPOSITORY: openkruise/charts
  DOCKER_HUB: docker.io/openkruise
  PROXY_SOURCE_IMAGE: ${{ vars.PROXY_SOURCE_IMAGE }}
  ZTUNNEL_REPOSITORY: openkruise/ztunnel

concurrency:
  # Stable releases update shared latest tags, so serialize all releases.
  group: agentio-release
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate release ref
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/heads/(master|release-[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Releases are restricted to master and versioned release branches" >&2
            exit 1
          fi

      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          version_major="${BASH_REMATCH[1]}"
          version_minor="${BASH_REMATCH[2]}"
          if [[ "$GITHUB_REF" =~ ^refs/heads/release-([0-9]+)\.([0-9]+) ]]; then
            if [[ "${version_major}.${version_minor}" != "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" ]]; then
              echo "Version ${VERSION} does not match branch ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            existing_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag ${GITHUB_REPOSITORY}@${VERSION} already points to ${existing_sha}" >&2
              exit 1
            fi
            echo "Tag ${GITHUB_REPOSITORY}@${VERSION} already points to ${GITHUB_SHA}; resuming release."
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REPOSITORY}@${VERSION} already exists" >&2
            exit 1
          fi

          ztunnel_repository=$(jq -er \
            '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .repoName' agentio.deps)
          ztunnel_sha=$(jq -er \
            '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .lastStableSHA' agentio.deps)
          proxy_digest=$(jq -er \
            '.[] | select(.name == "PROXY_IMAGE_DIGEST") | .digest' agentio.deps)
          if [[ "$ztunnel_repository" != "$ZTUNNEL_REPOSITORY" ]]; then
            echo "Unexpected ztunnel repository: $ztunnel_repository" >&2
            exit 1
          fi
          if [[ ! "$ztunnel_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ZTUNNEL_REPO_SHA: $ztunnel_sha" >&2
            exit 1
          fi
          if [[ ! "$proxy_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid PROXY_IMAGE_DIGEST: $proxy_digest" >&2
            exit 1
          fi
          if [[ "$(gh api "repos/${ZTUNNEL_REPOSITORY}/commits/${ztunnel_sha}" --jq .sha)" != "$ztunnel_sha" ]]; then
            echo "Unable to resolve ${ZTUNNEL_REPOSITORY}@${ztunnel_sha}" >&2
            exit 1
          fi
          if gh api "repos/${ZTUNNEL_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            existing_ztunnel_sha=$(gh api \
              "repos/${ZTUNNEL_REPOSITORY}/commits/${VERSION}" --jq .sha)
            if [[ "$existing_ztunnel_sha" != "$ztunnel_sha" ]]; then
              echo "Tag ${ZTUNNEL_REPOSITORY}@${VERSION} already points to ${existing_ztunnel_sha}" >&2
              exit 1
            fi
            echo "Tag ${ZTUNNEL_REPOSITORY}@${VERSION} already points to ${ztunnel_sha}; resuming release."
          fi

      - name: Validate release notes override
        env:
          VERSION: ${{ inputs.version }}
        run: |
          notes_file="docs/releases/${VERSION}.md"
          if [[ -e "$notes_file" ]]; then
            if [[ ! -s "$notes_file" ]]; then
              echo "Release notes override is empty: $notes_file" >&2
              exit 1
            fi
            if grep -Eq '\{\{[^}]+\}\}' "$notes_file"; then
              echo "Release notes contain unresolved template placeholders: $notes_file" >&2
              exit 1
            fi
            echo "Using release notes override: $notes_file"
          else
            echo "No release notes override; GitHub generated notes will be used."
          fi

  tag-agentio:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create Agentio tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            existing_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag ${GITHUB_REPOSITORY}@${VERSION} already points to ${existing_sha}" >&2
              exit 1
            fi
            echo "Tag ${GITHUB_REPOSITORY}@${VERSION} already points to ${GITHUB_SHA}; skipping."
            exit 0
          fi

          tag_object_sha=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$VERSION" \
            -f message="Agentio release ${VERSION}" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="$tag_object_sha" >/dev/null
          echo "Created ${GITHUB_REPOSITORY}@${VERSION} at ${GITHUB_SHA}."

  build-images:
    needs: tag-agentio
    uses: ./.github/workflows/agentio-image.yml
    with:
      tag: ${{ inputs.version }}
    secrets:
      HUB_KRUISE: ${{ secrets.HUB_KRUISE }}

  sync-images:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

      - name: Compute version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Resolve pinned proxy image
        run: |
          image="${PROXY_SOURCE_IMAGE}"
          digest=$(jq -er '.[] | select(.name == "PROXY_IMAGE_DIGEST") | .digest' agentio.deps)
          if [[ ! "$image" =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$ ]]; then
            echo "Invalid proxy image: $image" >&2
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid proxy digest: $digest" >&2
            exit 1
          fi
          {
            echo "PROXY_IMAGE=${image}"
            echo "PROXY_DIGEST=${digest}"
          } >> "$GITHUB_ENV"

      - name: Login to internal ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_TOKEN: ${{ secrets.ACR_TOKEN }}
        run: |
          if [[ -z "$ACR_USERNAME" && -z "$ACR_TOKEN" ]]; then
            echo "Using anonymous access for ${PROXY_IMAGE%%/*}"
          elif [[ -z "$ACR_USERNAME" || -z "$ACR_TOKEN" ]]; then
            echo "ACR_USERNAME and ACR_TOKEN must be set together" >&2
            exit 1
          else
            echo "$ACR_TOKEN" | crane auth login "${PROXY_IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
          fi

      - name: Login to Docker Hub
        env:
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.HUB_KRUISE }}
        run: echo "$HUB_TOKEN" | crane auth login docker.io -u "$HUB_USERNAME" --password-stdin

      - name: Sync proxy image
        run: |
          SRC="${PROXY_IMAGE}@${PROXY_DIGEST}"
          DST="${DOCKER_HUB}/proxyv2:${VERSION}"
          echo "Syncing ${SRC} -> ${DST}"
          crane copy "${SRC}" "${DST}"

  publish-chart:
    needs: sync-images
    if: needs.sync-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Compute version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Prepare chart for release
        run: |
          CHART_DIR="/tmp/chart-release/agentio"

          mkdir -p "$(dirname "$CHART_DIR")"
          cp -r "$CHART" "$CHART_DIR"

          go run ./tools/agentio-chart-sync prepare \
            --chart "$CHART_DIR" \
            --version "$VERSION" \
            --source-repository "$GITHUB_REPOSITORY"

          echo "CHART_DIR=${CHART_DIR}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify chart renders cleanly
        run: |
          helm lint "$CHART_DIR"
          helm template agentio "$CHART_DIR" >/dev/null
          helm template agentio "$CHART_DIR" \
            --set ambient.enabled=true \
            --set sidecarInjector.enabled=true >/dev/null

      - name: Package chart
        run: helm package "$CHART_DIR" -d /tmp/chart-pkg

      - name: Login to Docker Hub
        env:
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.HUB_KRUISE }}
        run: echo "$HUB_TOKEN" | helm registry login docker.io -u "$HUB_USERNAME" --password-stdin

      - name: Push chart to Docker Hub
        run: helm push "/tmp/chart-pkg/agentio-${CHART_VERSION}.tgz" "oci://docker.io/openkruise"

      - name: Upload released chart source
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: agentio-chart-${{ inputs.version }}
          path: /tmp/chart-release/agentio
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  submit-chart-pr:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENTIO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIO_SYNC_APP_PRIVATE_KEY }}
          owner: openkruise
          repositories: charts
          permission-contents: write
          permission-pull-requests: write

      - name: Check out OpenKruise charts
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CHART_REPOSITORY }}
          ref: master
          path: openkruise-charts
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Download released chart source
        uses: actions/download-artifact@v7
        with:
          name: agentio-chart-${{ inputs.version }}
          path: ${{ runner.temp }}/agentio-chart

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Publish chart branch and open pull request
        working-directory: openkruise-charts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED_CHART: ${{ runner.temp }}/agentio-chart
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          branch="agentio-chart-${VERSION}"
          version_dir="versions/agentio/${VERSION}"
          chart_link="charts/agentio"
          expected_link="../versions/agentio/${VERSION}"

          verify_branch_contents() {
            if [[ ! -d "$version_dir" || -L "$version_dir" ]]; then
              echo "Release branch is missing ${version_dir}" >&2
              return 1
            fi
            if ! diff -qr "$RELEASED_CHART" "$version_dir"; then
              echo "Release branch contains different files for Agentio ${VERSION}" >&2
              return 1
            fi
            if [[ ! -L "$chart_link" || "$(readlink "$chart_link")" != "$expected_link" ]]; then
              echo "Release branch has an unexpected ${chart_link} target" >&2
              return 1
            fi
          }

          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            git checkout --detach "refs/remotes/origin/${branch}"
            verify_branch_contents

            pr_state=$(gh pr list \
              --repo "$CHART_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json state \
              --jq '.[0].state // ""')
            pr_url=$(gh pr list \
              --repo "$CHART_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json url \
              --jq '.[0].url // ""')
            case "$pr_state" in
              OPEN|MERGED)
                echo "Chart pull request already exists: ${pr_url}"
                exit 0
                ;;
              CLOSED)
                echo "Chart pull request was closed without merging: ${pr_url}" >&2
                exit 1
                ;;
            esac

            gh pr create \
              --repo "$CHART_REPOSITORY" \
              --base master \
              --head "$branch" \
              --title "feat(agentio): release chart ${VERSION}" \
              --body "Publishes the Agentio ${VERSION} Helm chart. Source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}. OCI chart: oci://docker.io/openkruise/agentio."
            exit 0
          fi

          if [[ -e "$version_dir" || -L "$version_dir" ]]; then
            if [[ ! -d "$version_dir" || -L "$version_dir" ]]; then
              echo "Existing ${version_dir} is not a directory" >&2
              exit 1
            fi
            if ! diff -qr "$RELEASED_CHART" "$version_dir"; then
              echo "Agentio ${VERSION} is already published with different files" >&2
              exit 1
            fi
            echo "Agentio ${VERSION} is already present in ${CHART_REPOSITORY}; skipping."
            exit 0
          fi

          if [[ -e "$chart_link" && ! -L "$chart_link" ]]; then
            echo "Existing ${chart_link} is not a symbolic link" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$version_dir")"
          cp -R "$RELEASED_CHART" "$version_dir"
          ln -sfn "$expected_link" "$chart_link"

          helm lint "$chart_link"
          helm template agentio "$chart_link" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$version_dir" "$chart_link"
          git commit --signoff -m "feat(agentio): release chart ${VERSION}"
          git push origin "HEAD:refs/heads/${branch}"

          gh pr create \
            --repo "$CHART_REPOSITORY" \
            --base master \
            --head "$branch" \
            --title "feat(agentio): release chart ${VERSION}" \
            --body "Publishes the Agentio ${VERSION} Helm chart. Source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}. OCI chart: oci://docker.io/openkruise/agentio."

  sync-sandbox-manager-chart:
    needs: create-release
    uses: ./.github/workflows/sync-sandbox-manager-agentio-chart.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  tag-ztunnel:
    needs: publish-chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENTIO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIO_SYNC_APP_PRIVATE_KEY }}
          owner: openkruise
          repositories: ztunnel
          permission-contents: write

      - name: Create matching ztunnel tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          repository=$(jq -er \
            '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .repoName' agentio.deps)
          ztunnel_sha=$(jq -er \
            '.[] | select(.name == "ZTUNNEL_REPO_SHA") | .lastStableSHA' agentio.deps)
          if [[ "$repository" != "$ZTUNNEL_REPOSITORY" ]]; then
            echo "Unexpected ztunnel repository: $repository" >&2
            exit 1
          fi
          if [[ ! "$ztunnel_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ZTUNNEL_REPO_SHA: $ztunnel_sha" >&2
            exit 1
          fi

          if [[ "$(gh api "repos/${ZTUNNEL_REPOSITORY}/commits/${ztunnel_sha}" --jq .sha)" != "$ztunnel_sha" ]]; then
            echo "Unable to resolve ${ZTUNNEL_REPOSITORY}@${ztunnel_sha}" >&2
            exit 1
          fi

          ref_count=$(gh api \
            "repos/${ZTUNNEL_REPOSITORY}/git/matching-refs/tags/${VERSION}" \
            --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")
          if [[ "$ref_count" != "0" ]]; then
            existing_sha=$(gh api \
              "repos/${ZTUNNEL_REPOSITORY}/commits/${VERSION}" --jq .sha)
            if [[ "$existing_sha" != "$ztunnel_sha" ]]; then
              echo "Tag ${ZTUNNEL_REPOSITORY}@${VERSION} already points to ${existing_sha}" >&2
              exit 1
            fi
            echo "Tag ${ZTUNNEL_REPOSITORY}@${VERSION} already points to ${ztunnel_sha}; skipping."
            exit 0
          fi

          tag_object_sha=$(gh api --method POST \
            "repos/${ZTUNNEL_REPOSITORY}/git/tags" \
            -f tag="$VERSION" \
            -f message="Agentio release ${VERSION}" \
            -f object="$ztunnel_sha" \
            -f type=commit \
            --jq .sha)
          gh api --method POST \
            "repos/${ZTUNNEL_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="$tag_object_sha" >/dev/null
          echo "Created ${ZTUNNEL_REPOSITORY}@${VERSION} at ${ztunnel_sha}."

  promote-latest:
    needs: tag-ztunnel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false

      - name: Promote stable images to latest
        env:
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.HUB_KRUISE }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${VERSION} is a prerelease; latest tags will not be updated."
            exit 0
          fi

          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          echo "$HUB_TOKEN" | crane auth login docker.io \
            -u "$HUB_USERNAME" --password-stdin

          images=(pilot proxy-init proxyv2 install-cni ztunnel agentio-epe)

          declare -A version_digests
          for image in "${images[@]}"; do
            version_digests[$image]=$(crane digest \
              "${DOCKER_HUB}/${image}:${VERSION}")
            echo "Verified ${DOCKER_HUB}/${image}:${VERSION}@${version_digests[$image]}"
          done

          for image in "${images[@]}"; do
            echo "Tagging ${DOCKER_HUB}/${image}:${VERSION} -> latest"
            crane tag "${DOCKER_HUB}/${image}:${VERSION}" latest
          done

          for image in "${images[@]}"; do
            latest_digest=$(crane digest "${DOCKER_HUB}/${image}:latest")
            if [[ "$latest_digest" != "${version_digests[$image]}" ]]; then
              echo "latest digest mismatch for ${image}: ${latest_digest}" >&2
              exit 1
            fi
          done

  create-release:
    needs: promote-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          release_flags=()
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          notes_flags=(--generate-notes)
          notes_file="docs/releases/${VERSION}.md"
          if [[ -s "$notes_file" ]]; then
            notes_flags=(--notes-file "$notes_file")
          fi
          gh release create "$VERSION" \
            --title "Agentio ${VERSION}" \
            "${notes_flags[@]}" \
            "${release_flags[@]}" \
            --verify-tag
