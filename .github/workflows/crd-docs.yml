name: crd-docs

on:
  pull_request:
    branches:
      - master
    paths:
      - "manifests/charts/agentio/crds/**"
      - "tools/generate-crd-docs.sh"
      - "tools/crd-docs.tmpl"
      - "docs/reference/traffic-policy-api.md"
      - "docs/reference/security-profile-api.md"
      - ".github/workflows/crd-docs.yml"
  push:
    branches:
      - master
    paths:
      - "manifests/charts/agentio/crds/**"
      - "tools/generate-crd-docs.sh"
      - "tools/crd-docs.tmpl"
      - "docs/reference/traffic-policy-api.md"
      - "docs/reference/security-profile-api.md"
      - ".github/workflows/crd-docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Regenerate CRD API reference
        run: make gen.crddocs
      - name: Verify generated docs are committed
        run: |
          git diff --exit-code -- docs/reference/traffic-policy-api.md docs/reference/security-profile-api.md || {
            echo "CRD API reference pages are out of date. Run 'make gen.crddocs' and commit the result." >&2
            exit 1
          }
