apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 4
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels:
        app: backend
        agentio.kruise.io/dataplane-mode: none
    spec:
      containers:
        - name: agentio-sandbox-bench
          image: agentio-sandbox-bench:1018
          imagePullPolicy: IfNotPresent
          args: [--action=backend]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
    - port: 8080
      targetPort: 8080
