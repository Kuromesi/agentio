syntax = "proto3";

package kruise.networking.extensions.v1;

option go_package = "pilot/pkg/serviceregistry/kube/controller/agentio/extensions";

message PolicyBinding {
  oneof target_ref {
    WorkloadReference workload = 1;
  }

  // Keyed by the full xDS TypeURL of the referenced policy resources.
  map<string, PolicyReference> policy_refs = 2;
}

message WorkloadReference {
  string namespace = 1;
  string name = 2;
}

message PolicyReference {
  // Ordered by descending resource priority, then ascending resource name.
  repeated string resource_names = 1;
}

message SniTrafficPolicy {
  // Evaluated in the order produced by the control plane.
  repeated SniRule rules = 1;
}

message SniRule {
  SniMatch match = 1;
  SniAction action = 2;
}

message SniMatch {
  // Values are ORed. Supported forms are exact names, a leading wildcard,
  // and "*" for any non-empty SNI.
  repeated string sni = 1;
}

enum SniAction {
  SNI_ACTION_UNSPECIFIED = 0;
  SNI_ACTION_TLS_TERMINATION = 1;
  SNI_ACTION_PASSTHROUGH = 2;
  SNI_ACTION_DENY = 3;
}
