syntax = "proto3";

// This is a deliberately minimal, wire-compatible subset of the public
// Agentic Substrate ateapi protocol. Keep package, service, message field
// numbers, and wire types aligned with pkg/proto/ateapipb/ateapi.proto in
// github.com/agent-substrate/substrate.
package ateapi;

option go_package = "istio.io/istio/pilot/pkg/serviceregistry/kube/controller/agentio/substrateapi";

service Control {
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}
}

message ResourceMetadata {
  string atespace = 1;
  string name = 2;
  string uid = 3;
  int64 version = 4;
}

message ObjectRef {
  string atespace = 1;
  string name = 2;
}

message KubeNamespacedObjectRef {
  string namespace = 1;
  string name = 2;
}

message ActorAssignment {
  KubeNamespacedObjectRef actor_template = 1;
  ObjectRef actor = 2;
  string actor_uid = 3;
}

message WorkerStatus {
  reserved 1; // WorkerState state.
  ActorAssignment assignment = 2;
}

message Worker {
  ResourceMetadata metadata = 1;
  string worker_namespace = 2;
  string worker_pool = 3;
  string worker_pod = 4;
  string worker_pod_uid = 5;
  reserved 6 to 10;
  WorkerStatus status = 11;
}

// LegacyWorker is the public Worker wire schema used by Substrate commit
// 2b3a4715 and earlier deployments. It is kept here because the community API
// changed field numbers while retaining the same ListWorkers RPC.
message LegacyWorker {
  string worker_namespace = 1;
  string worker_pool = 2;
  string worker_pod = 3;
  LegacyAssignment assignment = 4;
  string ip = 5;
  int64 version = 6;
  string worker_pod_uid = 7;
  string node_name = 8;
  string sandbox_class = 9;
  map<string, string> labels = 10;
  int32 state = 11;
}

message LegacyAssignment {
  KubeNamespacedObjectRef actor_template = 1;
  ObjectRef actor = 2;
  string actor_uid = 3;
}

message ListWorkersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListWorkersResponse {
  // Worker changed incompatibly across community versions while retaining the
  // same field number and RPC. Decode each length-delimited message explicitly
  // so agentiod can support both public wire schemas.
  repeated bytes workers = 1;
  string next_page_token = 2;
}
