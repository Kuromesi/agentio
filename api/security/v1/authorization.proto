syntax = "proto3";

// This file extends Istio's workloadapi/security/authorization.proto with the
// Agentio authorization fields (auth_extensions, destination port ranges). The
// wire contract with the data plane is unchanged: field numbers are identical
// and resources are served under the type URL
// type.googleapis.com/istio.security.Authorization (see
// model.WorkloadAuthorizationType).
//
// The descriptor package is agentio.security rather than istio.security
// because upstream istio.io/istio registers the unextended istio.security
// namespace in the protobuf global registry, and the gateway deployment
// controller links that tree into the same binary; a second registration of
// one namespace panics at process init
// (https://protobuf.dev/reference/go/faq#namespace-conflict).
package agentio.security;
option go_package = "github.com/openkruise/agentio/api/security/v1;securityv1";

import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";

message Authorization {
  string name = 1;
  string namespace = 2;

  // Determine the scope of this RBAC policy.
  // If set to NAMESPACE, the 'namespace' field value will be used.
  Scope scope = 3;
  // The action to take if the request is matched with the rules.
  // Default is ALLOW if not specified.
  Action action = 4;
  // Set of RBAC policy groups each containing its rules.
  // If at least one of the groups is matched the policy action will
  // take place.
  // Groups are OR-ed.
  repeated Group groups = 5;

  // Whether or not this is a dry run policy.
  // Dry run policies are not enforced, but their matches are logged
  bool dry_run = 6;

  repeated Extension auth_extensions = 999;
}

message Group {
  // Rules are AND-ed
  // This is a generic form of the authz policy's to, from and when
  repeated Rules rules = 1;
}

message Rules {
  // The logical behavior between the matches (if there are more than one)
//  MatchBehavior match_behavior = 1;

  // Conditions within a rule are AND-ed (e.g. ALL conditions must be true)
  repeated Match matches = 2;
}

message Match {
  // Values of specific type are ORed
  // If multiple types are set, they are ANDed

  repeated StringMatch namespaces = 1;
  repeated StringMatch not_namespaces = 2;

  repeated ServiceAccountMatch service_accounts = 11;
  repeated ServiceAccountMatch not_service_accounts = 12;

  repeated StringMatch principals = 3;
  repeated StringMatch not_principals = 4;

  repeated Address source_ips = 5;
  repeated Address not_source_ips = 6;

  repeated Address destination_ips = 7;
  repeated Address not_destination_ips = 8;

  repeated uint32 destination_ports = 9;
  repeated uint32 not_destination_ports = 10;

  repeated PortRange destination_port_ranges = 990;
  repeated PortRange not_destination_port_ranges = 991;
}

message PortRange {
  uint32 start = 1;
  uint32 end = 2;
  // Network protocol (e.g. "TCP", "UDP", "ICMP", "SCTP").
  // Empty means any protocol.
  Protocol protocol = 3;
}

enum Protocol {
  ALL = 0;
  TCP = 1;
  UDP = 2;
  ICMP = 3;
  SCTP = 4;
}


message Address {
  bytes address = 1;
  uint32 length = 2;
}

message ServiceAccountMatch {
  string namespace = 1;
  string serviceAccount = 2;
}

message StringMatch {
  oneof match_type {
    // exact string match
    string exact = 1;
    // prefix-based match
    string prefix = 2;

    // suffix-based match
    string suffix = 3;

    google.protobuf.Empty presence = 4;
  }
}

enum Scope {
  // ALL means that the authorization policy will be applied to all workloads
  // in the mesh (any namespace).
  GLOBAL = 0;
  // NAMESPACE means that the policy will only be applied to workloads in a
  // specific namespace.
  NAMESPACE = 1;
  // WORKLOAD_SELECTOR means that the policy will only be applied to specific
  // workloads that were selected by their labels.
  WORKLOAD_SELECTOR = 2;
}

enum Action {
  // Allow the request if it matches with the rules.
  ALLOW = 0;
  // Deny the request if it matches with the rules.
  DENY = 1;
}

// Extension provides a mechanism to attach arbitrary additional configuration to an object.
message Extension {
  // name provides an opaque name for the extension.
  // This may have semantic meaning or used for debugging.
  // This should be unique amongst all extensions attached to an item.
  string name = 1;
  // config provides some opaque configuration.
  google.protobuf.Any config = 2;
}
