apiVersion: v1
kind: Namespace
metadata:
  name: udp-hbone-poc
  labels:
    istio-injection: enabled
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: udp-hbone-poc
  labels:
    networking.agents.kruise.io/sandbox-egress: "true"
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo
  namespace: udp-hbone-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-echo
  template:
    metadata:
      labels:
        app: udp-echo
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: echo
        image: alpine/socat:1.8.0.3
        args:
        - -v
        - UDP4-RECVFROM:9000,fork,reuseaddr
        - EXEC:/bin/cat
        ports:
        - name: udp
          containerPort: 9000
          protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: udp-echo
  namespace: udp-hbone-poc
  labels:
    istio.io/use-waypoint: waypoint
spec:
  selector:
    app: udp-echo
  ports:
  - name: udp
    port: 9000
    protocol: UDP
    targetPort: udp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-client
  namespace: udp-hbone-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-client
  template:
    metadata:
      labels:
        app: udp-client
      annotations:
        inject.istio.io/templates: ztunnel
        proxy.istio.io/config: |
          proxyMetadata:
            UNSTABLE_ENABLE_UDP_HBONE: "true"
            PACKET_MARK: "1337"
    spec:
      serviceAccountName: default
      initContainers:
      - name: udp-tproxy-init
        image: localhost:5000/proxy-init:istio-testing
        command: ["/bin/sh", "-c"]
        args:
        - |
          ip route replace local 0.0.0.0/0 dev lo table 100
          ip rule add fwmark 0x111/0xfff pref 32764 lookup 100 || true
          iptables -t mangle -I OUTPUT 1 ! -d 127.0.0.1/32 -p udp --dport 9000 -m mark ! --mark 0x539/0xfff -m owner ! --uid-owner 1337 -j MARK --set-xmark 0x111/0xfff
          iptables -t mangle -I PREROUTING 1 -p udp -m mark --mark 0x111/0xfff -j TPROXY --on-port 15002 --tproxy-mark 0x111/0xfff
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN]
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
      containers:
      - name: client
        image: alpine:3.20
        command: ["/bin/sh", "-c", "sleep infinity"]
