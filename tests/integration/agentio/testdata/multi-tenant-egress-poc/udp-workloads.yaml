apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-a
  namespace: udp-hbone-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-b
  namespace: udp-hbone-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unknown-tenant
  namespace: udp-hbone-poc
---
apiVersion: v1
kind: Pod
metadata:
  name: udp-client-a
  namespace: udp-hbone-poc
  labels:
    app: udp-client-a
  annotations:
    inject.istio.io/templates: ztunnel
    proxy.istio.io/config: |
      proxyMetadata:
        UNSTABLE_ENABLE_UDP_HBONE: "true"
        PACKET_MARK: "1337"
spec:
  serviceAccountName: tenant-a
  initContainers:
  - name: udp-tproxy-init
    image: localhost:5000/proxy-init:istio-testing
    command: ["/bin/sh", "-c"]
    args:
    - |
      ip route replace local 0.0.0.0/0 dev lo table 100
      ip rule add fwmark 0x111/0xfff pref 32764 lookup 100 || true
      iptables -t mangle -I OUTPUT 1 ! -d 127.0.0.1/32 -p udp --dport 9000 -m mark ! --mark 0x539/0xfff -m owner ! --uid-owner 1337 -j MARK --set-xmark 0x111/0xfff
      iptables -t mangle -I PREROUTING 1 -p udp -m mark --mark 0x111/0xfff -j TPROXY --on-port 15002 --tproxy-mark 0x111/0xfff
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: [NET_ADMIN]
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: false
      runAsUser: 0
  containers:
  - name: client
    image: alpine/socat:1.8.0.3
    command: ["/bin/sh", "-c", "sleep infinity"]
---
