apiVersion: v1
kind: ConfigMap
metadata:
  name: forward-http-connect-proxy
data:
  envoy.yaml: |-
{{ .EnvoyYAML | indent 4 }}
  external-forward-proxy-key.pem: |-
{{ .ProxyKey | indent 4 }}
  external-forward-proxy-cert.pem: |-
{{ .ProxyCertChain | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forward-http-connect-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forward-http-connect-proxy
  template:
    metadata:
      labels:
        app: forward-http-connect-proxy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.21.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
      volumes:
      - name: config
        configMap:
          name: forward-http-connect-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: forward-http-connect-proxy
spec:
  type: NodePort
  selector:
    app: forward-http-connect-proxy
  ports:
  - name: http-connect
    port: 3128
    targetPort: 3128
    nodePort: 32128
  - name: https-connect
    port: 4128
    targetPort: 4128
    nodePort: 32129
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forward-http-connect-proxy-ca
  labels:
    manifests.agents.kruise.io/kube-source: "true"
data:
  sources: |
    apiVersion: networking.istio.io/v1alpha3
    kind: EnvoyFilter
    metadata:
      name: forward-http-connect-proxy-ca
    spec:
      workloadSelector:
        labels:
          gateway.networking.k8s.io/gateway-name: egress-gateway
      configPatches:
      - applyTo: CLUSTER
        match:
          cluster:
            name: tls_proxy_originate
        patch:
          operation: MERGE
          value:
            transport_socket:
              name: envoy.transport_sockets.tls
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                common_tls_context:
                  validation_context:
                    trusted_ca:
                      inline_string: |-
{{ .ProxyCA | indent 24 }}
