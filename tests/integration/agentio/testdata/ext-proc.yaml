apiVersion: v1
kind: Service
metadata:
  name: ext-proc
  labels:
    app: ext-proc
    service: ext-proc
spec:
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
  selector:
    app: ext-proc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-proc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-proc
  template:
    metadata:
      labels:
        app: ext-proc
    spec:
      containers:
      - image: registry-cn-hangzhou.ack.aliyuncs.com/dev/asm-ext-proc:test
        imagePullPolicy: Always
        name: ext-proc
        env:
        - name: REQUEST_HEADERS_TO_ADD
          value: "x-hello-to-ext-proc=true"
        - name: RESPONSE_HEADERS_TO_ADD
          value: "x-hello-from-ext-proc=true"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        ports:
        - containerPort: 9002